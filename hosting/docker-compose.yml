services:
  privacy:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:43130:80"
    volumes:
      - /data/chrome-extensions/privacy:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
